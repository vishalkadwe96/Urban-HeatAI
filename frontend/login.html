<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Heat AI — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
  <canvas id="bg-canvas"></canvas>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>

  <nav class="navbar">
    <div class="nav-brand"><span class="logo">🌡️</span> Urban Heat AI</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="admin.html">Admin</a>
      <a href="login.html" class="active">Login</a>
    </div>
  </nav>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-badge">🛰️ Live Satellite Analytics · Indian Cities</div>
      <h1 class="auth-title">Welcome to Urban Heat AI</h1>
      <p class="auth-sub" id="auth-sub">Enter your email and password to continue.</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tab-login" role="tab" data-mode="login">Login</button>
        <button type="button" class="auth-tab" id="tab-register" role="tab" data-mode="register">Register</button>
      </div>

      <form id="auth-form" novalidate>
        <div class="field" id="field-name" hidden>
          <label for="auth-name">Full name</label>
          <input type="text" id="auth-name" autocomplete="name" placeholder="Your name">
        </div>
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="auth-password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
          </div>
          <small class="field-hint" id="pw-hint" hidden>At least 8 characters.</small>
        </div>

        <div class="auth-error" id="auth-error" role="alert" hidden></div>

        <button type="submit" class="auth-submit" id="auth-submit">Login →</button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <div id="google-btn-slot">
        <button type="button" class="google-btn" id="google-fallback">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
            <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <p class="auth-switch" id="auth-switch">
        New here? <a href="#" id="switch-link">Register — create your new account</a>
      </p>
    </section>
  </main>

  <script src="js/effects.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
